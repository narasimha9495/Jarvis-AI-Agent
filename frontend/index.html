<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — Your Personal AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body data-theme="dark">

    <!-- Top Navigation -->
    <header class="top-bar">
        <div class="logo-container">
            <div class="ai-avatar" id="aiAvatar">
                <div class="avatar-ring"></div>
                <span class="avatar-icon">✦</span>
            </div>
            <div class="logo-text">
                <div class="logo">JARVIS</div>
                <div class="logo-subtitle">Your Personal AI Assistant</div>
            </div>
            <div class="status-indicator">
                <div id="connectionDot" class="status-dot disconnected"></div>
                <span id="connectionText">Connecting...</span>
            </div>
        </div>
        <div class="top-actions">
            <button class="btn-icon theme-toggle" id="themeToggle" title="Toggle Theme" onclick="toggleTheme()">🌙</button>
            <button class="btn-icon" id="settingsBtn" title="AI Settings" onclick="openSettings()">⚙️</button>
            <select id="providerSelect" class="provider-select">
                <option value="gemini">Gemini AI</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Left Sidebar: Profile & Actions -->
        <aside class="sidebar-left">
            <!-- Greeting Card -->
            <div class="greeting-card" id="greetingCard">
                <div class="greeting-time" id="greetingTime">Good Evening</div>
                <div class="greeting-name" id="greetingName">Narasimha</div>
                <div class="greeting-date" id="greetingDate"></div>
            </div>

            <!-- Smart Suggestions -->
            <div class="suggestions-section">
                <div class="section-title">✨ Suggestions</div>
                <div id="smartSuggestions" class="smart-suggestions">
                    <button class="suggestion-chip" onclick="useSuggestion('What are my pending tasks?')">📋 Pending tasks</button>
                    <button class="suggestion-chip" onclick="useSuggestion('Give me my daily summary')">📊 Daily summary</button>
                    <button class="suggestion-chip" onclick="useSuggestion('Start a pomodoro for deep work')">⏱️ Focus mode</button>
                </div>
            </div>

            <div class="section-title">Quick Actions</div>
            <div class="quick-actions">
                <button class="btn" onclick="quickAction('new-task')">✓ New Task</button>
                <button class="btn" onclick="quickAction('set-reminder')">🔔 Set Reminder</button>
                <button class="btn" onclick="quickAction('new-note')">📝 Create Note</button>
                <button class="btn" onclick="quickAction('web-search')">🌐 Web Search</button>
                <button class="btn" onclick="quickAction('weather')">🌤️ Weather</button>
                <button class="btn" onclick="quickAction('add-expense')">💰 Add Expense</button>
                <button class="btn" onclick="quickAction('pomodoro')">⏱️ Pomodoro</button>
                <button class="btn" onclick="quickAction('log-habit')">✅ Log Habit</button>
            </div>
            
            <div class="section-title" style="margin-top: 20px;">System</div>
            <div class="system-stats">
                <div class="stat-bar">
                    <span class="stat-label">CPU</span>
                    <div class="stat-track"><div id="cpuBar" class="stat-fill" style="width:0%"></div></div>
                    <span id="sysCpu" class="stat-value">0%</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">RAM</span>
                    <div class="stat-track"><div id="ramBar" class="stat-fill" style="width:0%"></div></div>
                    <span id="sysRam" class="stat-value">0%</span>
                </div>
                <div class="stat-bar">
                    <span class="stat-label">DISK</span>
                    <div class="stat-track"><div id="diskBar" class="stat-fill" style="width:0%"></div></div>
                    <span id="sysDisk" class="stat-value">0%</span>
                </div>
            </div>
            <button class="btn" style="margin-top: 10px; font-size: 11px;" onclick="quickAction('daily-summary')">📊 Daily Summary</button>
        </aside>

        <!-- Center: Chat Interface -->
        <main class="chat-container">
            <!-- Mood indicator -->
            <div class="mood-bar" id="moodBar">
                <span class="mood-label">AI Mood:</span>
                <span class="mood-emoji" id="moodEmoji">😊</span>
                <span class="mood-text" id="moodText">Ready to help</span>
            </div>

            <div id="chatMessages" class="chat-messages">
                <!-- Welcome message rendered by JS -->
            </div>
            
            <div id="typingIndicator" class="typing-indicator">
                <div class="thinking-animation">
                    <span class="thinking-text">Thinking</span>
                    <div class="thinking-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <button class="btn-icon" title="Voice Input (Coming Soon)">🎤</button>
                <input type="text" id="messageInput" class="input-box" placeholder="Ask me anything..." autocomplete="off">
                <button class="btn-icon btn-send" onclick="sendMessage()">➤</button>
            </div>
        </main>

        <!-- Right Sidebar: Data Panels -->
        <aside class="sidebar-right">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
                <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders')">Reminders</button>
                <button class="tab-btn" data-tab="notes" onclick="switchTab('notes')">Notes</button>
                <button class="tab-btn" data-tab="expenses" onclick="switchTab('expenses')">Expenses</button>
                <button class="tab-btn" data-tab="habits" onclick="switchTab('habits')">Habits</button>
            </div>
            
            <div id="tasksPanel" class="tab-panel active">
                <div id="tasksList"></div>
            </div>
            
            <div id="remindersPanel" class="tab-panel">
                <div id="remindersList"></div>
            </div>
            
            <div id="notesPanel" class="tab-panel">
                <div id="notesList"></div>
            </div>

            <div id="expensesPanel" class="tab-panel">
                <div id="expensesSummary" class="expenses-summary">Loading summary...</div>
                <div id="expensesList"></div>
            </div>

            <div id="habitsPanel" class="tab-panel">
                <div id="habitsList"></div>
            </div>
        </aside>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">AUTHORIZATION REQUIRED</h2>
            <div id="confirmMessage" class="modal-text">Are you sure you want to proceed with this action?</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="cancelAction()">CANCEL</button>
                <button class="modal-btn confirm" onclick="confirmAction()">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- AI Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content settings-modal">
            <h2 class="modal-title">⚙️ AI PERSONALITY</h2>
            <div class="settings-body">
                <div class="setting-group">
                    <label class="setting-label">Your Name</label>
                    <input type="text" id="userName" class="setting-input" value="Narasimha" onchange="saveSettings()">
                </div>
                <div class="setting-group">
                    <label class="setting-label">AI Personality</label>
                    <select id="aiPersonality" class="setting-input" onchange="saveSettings()">
                        <option value="professional">🎩 Professional</option>
                        <option value="friendly" selected>😊 Friendly</option>
                        <option value="casual">😎 Casual</option>
                        <option value="motivational">🔥 Motivational</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Response Style</label>
                    <select id="responseStyle" class="setting-input" onchange="saveSettings()">
                        <option value="concise">⚡ Concise</option>
                        <option value="balanced" selected>⚖️ Balanced</option>
                        <option value="detailed">📖 Detailed</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Theme</label>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">🌙 Dark</button>
                        <button class="theme-btn" data-theme="midnight" onclick="setTheme('midnight')">🌌 Midnight</button>
                        <button class="theme-btn" data-theme="light" onclick="setTheme('light')">☀️ Light</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn confirm" onclick="closeSettings()">DONE</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="js/app.js"></script>
</body>
</html>
